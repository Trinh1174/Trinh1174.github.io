<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Học tiếng Việt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
	<h1></h1>
	<div class="title-bar">
		<h1>Bienvenue sur Học tiếng Việt</h1>
		<h2>Avec Thị Ngọc Trinh (Má)</h2>
	</div>
	<div class="article-container">
		<div class="index-article" id="frontline">Loading...</div>
	</div>

	<div class="classes-wrapper">
		<a href="clavier.html" class="button-link classes-button">⌨️ Clavier vietnamien</a>
		<a href="alphabet.html" class="button-link classes-button">📘 L'alphabet</a>
		<a href="tons.html" class="button-link classes-button">🎵 Les tons</a>
		<a href="nombres.html" class="button-link classes-button">🔢 Les chiffres</a>
		<a href="couleurs.html" class="button-link classes-button">🎨​ Les couleurs</a>
		<a href="temps.html" class="button-link classes-button">⏰ Le temps</a>
		<a href="questions.html" class="button-link classes-button">❔ Les questions</a>
		<a href="adresser.html" class="button-link classes-button">👥 S'adresser à</a>
		<a href="positions.html" class="button-link classes-button">👥 Position</a>
	</div>

	<br/>
  	<a href="logs.html" class="button-link logs-button">📜 Logs</a>

	<script>
		document.addEventListener('DOMContentLoaded', async () => {
		  const proxy = url =>
			`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
		
		  try {
			const html = await fetch(proxy('https://www.vietnamplus.vn/'))
							   .then(r => { if (!r.ok) throw r; return r.text() });
			const doc = new DOMParser().parseFromString(html, 'text/html');
		
			const headlineEl = doc.querySelector(
			  '.abf-homepage .wrapper.two .story__heading a.cms-link'
			);
			const timeEl = doc.querySelector(
			  '.abf-homepage .wrapper.two time.time'
			);
		
			const title = headlineEl
			  ? headlineEl.textContent.trim()
			  : '— not found —';
		
			let formattedDate = '— no date —';
			if (timeEl) {
			  const raw = timeEl.getAttribute('datetime') || timeEl.textContent.trim();
			  const dt  = new Date(raw);
			  if (!isNaN(dt)) {
				const two = n => n.toString().padStart(2, '0');
				formattedDate = `${two(dt.getDate())}/${two(dt.getMonth()+1)}/${two(dt.getFullYear()%100)} ${two(dt.getHours())}:${two(dt.getMinutes())}`;
			  }
			}
		
			document.getElementById('frontline').innerHTML = `
			  <h1>Article du jour</h1>
			  <h2>${title}</h2>
			  <p>🕒 ${formattedDate}</p>
			`;
		
			// ← NEW: redirect to VietnamPlus homepage in a new tab
			const container = document.querySelector('.article-container');
			container.addEventListener('click', () => {
			  window.open('https://www.vietnamplus.vn/', '_blank');
			});
		  }
		  catch (err) {
			document.getElementById('frontline').textContent =
			  'Error loading frontline: ' + err.message;
		  }
		});
	</script>
</body>
</html>
